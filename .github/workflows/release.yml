# Release the npm package and create the matching GitHub release.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual release ({0}) by @{1}', inputs.version || inputs.release_type, github.actor) || format('Tagged release {0} by @{1}', github.ref_name, github.actor) }}"

concurrency:
    group: "${{ github.workflow }}-${{ github.repository }}"
    cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/v') }}"

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        if: "${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        outputs:
            package_name: "${{ steps.version.outputs.package_name }}"
            version: "${{ steps.version.outputs.version }}"
            tag: "${{ steps.version.outputs.tag }}"
            npm_release_url: "${{ steps.version.outputs.npm_release_url }}"
            github_release_url: "${{ steps.version.outputs.github_release_url }}"
        permissions:
            contents: "write"
            id-token: "write"
        env:
            CI: "true"
            DEFAULT_RELEASE_BRANCH: "main"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_NOTES_PATH: "temp/release-notes.md"
            RELEASE_ASSETS_DIR: "temp/release-assets"
        concurrency:
            group: "release-pipeline"
            cancel-in-progress: false

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  ref: "${{ github.sha }}"
                  token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Validate immutable release source"
              id: "source"
              env:
                  EVENT_NAME: "${{ github.event_name }}"
              run: |
                  set -euo pipefail
                  source_sha=$(git rev-parse HEAD)

                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_RELEASE_BRANCH}" ]; then
                      echo "Manual releases must be dispatched from ${DEFAULT_RELEASE_BRANCH}; received ${GITHUB_REF}." >&2
                      exit 1
                    fi

                    git fetch --no-tags origin "refs/heads/${DEFAULT_RELEASE_BRANCH}:refs/remotes/origin/${DEFAULT_RELEASE_BRANCH}"
                    remote_main_sha=$(git rev-parse "refs/remotes/origin/${DEFAULT_RELEASE_BRANCH}")
                    if [ "$source_sha" != "$remote_main_sha" ]; then
                      echo "Dispatch SHA ${source_sha} is not current origin/${DEFAULT_RELEASE_BRANCH} (${remote_main_sha})." >&2
                      exit 1
                    fi
                    source_branch="$DEFAULT_RELEASE_BRANCH"
                  else
                    source_branch="tag:${GITHUB_REF_NAME}"
                  fi

                  {
                    echo "ref=${GITHUB_REF}"
                    echo "branch=${source_branch}"
                    echo "sha=${source_sha}"
                  } >> "$GITHUB_OUTPUT"

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Setup repository npm version"
              run: |
                  set -euo pipefail
                  expected_npm=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global "npm@${expected_npm}"
                  actual_npm=$(npm --version)
                  test "$actual_npm" = "$expected_npm"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Configure Git for release automation"
              if: "github.event_name == 'workflow_dispatch'"
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags

            - name: "Validate workflow_dispatch release input"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  explicit_version="${EXPLICIT_VERSION:-}"
                  if [ -n "$explicit_version" ]; then
                    if [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid version input '$explicit_version'. Use x.y.z format." >&2
                      exit 1
                    fi
                    exit 0
                  fi

                  release_type="${RELEASE_TYPE:-patch}"
                  case "$release_type" in
                    patch|minor|major)
                      exit 0
                      ;;
                    *)
                      echo "Invalid release_type '$release_type'. Allowed: patch, minor, major." >&2
                      exit 1
                      ;;
                  esac

            - name: "Validate tag matches package version"
              if: "startsWith(github.ref, 'refs/tags/v')"
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
                    exit 1
                  fi

            - name: "Install Actionlint"
              env:
                  GOBIN: "${{ runner.temp }}/actionlint/bin"
              run: |
                  set -euo pipefail
                  mkdir -p "$GOBIN"
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  echo "$GOBIN" >> "$GITHUB_PATH"

            - name: "Verify package"
              run: "npm run release:check"

            - name: "Ensure verification did not modify tracked files"
              run: |
                  set -euo pipefail
                  if ! git diff --quiet || ! git diff --cached --quiet; then
                    echo "release:check modified tracked files; release verification must be reproducible." >&2
                    git status --short
                    exit 1
                  fi

            - name: "Determine release version"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    explicit_version="${EXPLICIT_VERSION:-}"
                    if [ -n "$explicit_version" ]; then
                      npm version "$explicit_version" --no-git-tag-version
                      version="$explicit_version"
                    else
                      release_type="${RELEASE_TYPE:-patch}"
                      npm version "$release_type" --no-git-tag-version
                      version=$(node -p "require('./package.json').version")
                    fi
                  else
                    tag="${GITHUB_REF_NAME}"
                    version="${tag#v}"
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  tag="v${version}"
                  npm_release_url="https://www.npmjs.com/package/${package_name}/v/${version}"
                  github_release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

                  {
                    echo "version=$version"
                    echo "tag=$tag"
                    echo "package_name=$package_name"
                    echo "npm_release_url=$npm_release_url"
                    echo "github_release_url=$github_release_url"
                  } >> "$GITHUB_OUTPUT"

            - name: "Rebuild package after manual version bump"
              if: "github.event_name == 'workflow_dispatch'"
              run: "npm run build"

            - name: "Enforce release version-file allowlist"
              if: "github.event_name == 'workflow_dispatch'"
              run: |
                  set -euo pipefail
                  expected_files=$'package-lock.json\npackage.json'
                  changed_files=$(git diff --name-only | LC_ALL=C sort)
                  untracked_files=$(git ls-files --others --exclude-standard)

                  if [ "$changed_files" != "$expected_files" ]; then
                    echo "npm version must modify exactly package.json and package-lock.json." >&2
                    printf 'Observed tracked changes:\n%s\n' "${changed_files:-<none>}" >&2
                    exit 1
                  fi
                  if ! git diff --cached --quiet; then
                    echo "The index must remain empty before the explicit release staging step." >&2
                    exit 1
                  fi
                  if [ -n "$untracked_files" ]; then
                    echo "Unexpected untracked files were produced before the release commit:" >&2
                    printf '%s\n' "$untracked_files" >&2
                    exit 1
                  fi

            - name: "Check whether version is already published"
              id: "npm_check"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
                    echo "already_published=true" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is already published to npm."
                  else
                    echo "already_published=false" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is available for publishing."
                  fi

            - name: "Prevent duplicate workflow_dispatch release version"
              if: "github.event_name == 'workflow_dispatch' && steps.npm_check.outputs.already_published == 'true'"
              env:
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  echo "Version ${VERSION} is already published. Choose a new release type/version." >&2
                  exit 1

            - name: "Ensure manual release identities are unused"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Remote tag ${TAG} already exists." >&2
                    exit 1
                  fi
                  if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
                    echo "GitHub release ${TAG} already exists." >&2
                    exit 1
                  fi

            - name: "Commit and push release version + tag"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  BRANCH: "${{ steps.source.outputs.branch }}"
                  SOURCE_SHA: "${{ steps.source.outputs.sha }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail

                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists locally." >&2
                    exit 1
                  fi

                  git add -- package.json package-lock.json
                  if git diff --cached --quiet; then
                      echo "No staged changes found for release commit." >&2
                      exit 1
                  fi

                  git commit -m "chore: release ${TAG}"
                  git tag -a "$TAG" -m "$TAG"
                  git push --atomic --no-follow-tags \
                    --force-with-lease="refs/heads/${BRANCH}:${SOURCE_SHA}" \
                    origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"

            - name: "Generate release notes from git-cliff"
              env:
                  EXPECTED_TAG: "${{ steps.version.outputs.tag }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected local tag ${EXPECTED_TAG} does not exist."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    displayed_head_tags=${head_tags//$'\n'/, }
                    if [ -z "$displayed_head_tags" ]; then
                      displayed_head_tags="(none)"
                    fi
                    echo "::error::Expected ${EXPECTED_TAG} to be the only tag at HEAD, but found: ${displayed_head_tags}."
                    exit 1
                  fi

                  mkdir -p temp
                  npm run --silent changelog:release-notes -- --output "${RELEASE_NOTES_PATH}"
                  if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                    echo "No release notes were generated by git-cliff." > "${RELEASE_NOTES_PATH}"
                  fi

            - name: "Publish to npm"
              if: "steps.npm_check.outputs.already_published != 'true'"
              run: "npm publish --access public --provenance --ignore-scripts"

            - name: "Create release archives"
              id: "release_assets"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail

                  assets_dir="${RELEASE_ASSETS_DIR}"
                  unpack_dir="temp/release-package"
                  pack_metadata_path="${assets_dir}/npm-pack.json"
                  mkdir -p "$assets_dir"
                  rm -rf "$unpack_dir"

                  npm pack --json --pack-destination "$assets_dir" > "$pack_metadata_path"

                  tarball_filename=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { parseNpmPackMetadata } from './scripts/_internal/npm-pack-metadata.mjs'; process.stdout.write(parseNpmPackMetadata(readFileSync(process.argv[1], 'utf8')).filename);" "$pack_metadata_path")
                  tarball_path="${assets_dir}/${tarball_filename}"
                  safe_package_name=$(printf '%s' "$PACKAGE_NAME" | sed 's/^@//; s#/#-#g')
                  zip_basename="${safe_package_name}-${VERSION}"

                  mkdir -p "$unpack_dir"
                  tar -xzf "$tarball_path" -C "$unpack_dir"
                  mv "$unpack_dir/package" "$unpack_dir/${zip_basename}"

                  (
                    cd "$unpack_dir"
                    zip -rq "../release-assets/${zip_basename}.zip" "${zip_basename}"
                  )

                  {
                    echo "tarball_path=$tarball_path"
                    echo "zip_path=${assets_dir}/${zip_basename}.zip"
                    echo "tarball_name=$tarball_filename"
                    echo "zip_name=${zip_basename}.zip"
                  } >> "$GITHUB_OUTPUT"

            - name: "Create GitHub release"
              uses: "softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b" # v3.0.1
              with:
                  tag_name: "${{ steps.version.outputs.tag }}"
                  name: "${{ steps.version.outputs.tag }}"
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  files: |
                      ${{ steps.release_assets.outputs.tarball_path }}
                      ${{ steps.release_assets.outputs.zip_path }}
                  fail_on_unmatched_files: true
                  generate_release_notes: false
                  overwrite_files: true
                  prerelease: false
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Release summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## 🚀 Release Summary"
                    echo ""
                    echo "- Event: \`${{ github.event_name }}\`"
                    echo "- Actor: @${{ github.actor }}"
                    echo "- Ref: \`${{ steps.source.outputs.ref }}\`"
                    echo "- Source branch: \`${{ steps.source.outputs.branch }}\`"
                    echo "- Source SHA: \`${{ steps.source.outputs.sha }}\`"
                    echo "- Package: \`${{ steps.version.outputs.package_name }}\`"
                    echo "- Version: \`${{ steps.version.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
                    echo "- Already published on npm: \`${{ steps.npm_check.outputs.already_published }}\`"
                    echo "- npm package: [${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}](${{ steps.version.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.version.outputs.tag }}](${{ steps.version.outputs.github_release_url }})"
                    echo "- Release assets: \`${{ steps.release_assets.outputs.tarball_name }}\`, \`${{ steps.release_assets.outputs.zip_name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
